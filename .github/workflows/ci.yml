name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test

  # The payments provider integration (Flutterwave, Selcom, webhook signature
  # verification) is a Supabase Edge Function and runs on Deno, not Node/Vitest
  # — it was previously untested by CI entirely. This job is separate from
  # build-and-test because it needs the Deno runtime, not Node.
  payments-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # deno.lock lives here; running from repo root fails dependency
        # resolution for the npm: specifiers this function imports.
        working-directory: src/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Keep these flags identical to "test:payments" in package.json. Network is denied and
      # the environment is emptied so the tests can never reach a live payment provider;
      # isolation.test.ts fails if either protection is removed.
      - run: deno test --allow-env --deny-net --no-prompt --preload server/payments/test-support/isolate_env.ts server/payments/__tests__/
